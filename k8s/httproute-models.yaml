apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: models-route
  namespace: default
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: inference-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1
      headers:
      - type: Exact
        name: x-model
        value: qwen2.5-3b-instruct
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: qwen2.5-3b-instruct
    timeouts:
      request: 300s
  - matches:
    - path:
        type: PathPrefix
        value: /v1
      headers:
      - type: Exact
        name: x-model
        value: smollm2-1.7b-instruct
    backendRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: smollm2-1.7b-instruct
    timeouts:
      request: 300s
