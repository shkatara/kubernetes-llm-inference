apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen2.5-3b-instruct
  namespace: default
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen2.5-3b-instruct
  template:
    metadata:
      labels:
        app: qwen2.5-3b-instruct
        demo: llm
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:v0.11.1
        args:
        - --model
        - Qwen/Qwen2.5-3B-Instruct
        - --served-model-name
        - qwen2.5-3b-instruct
        - --dtype
        - half
        - --enable-prefix-caching
        - --host
        - 0.0.0.0
        - --port
        - "8000"
        - --max-model-len
        - "8192"
        - --gpu-memory-utilization
        - "0.85"
        ports:
        - name: http
          containerPort: 8000
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: 11Gi
          requests:
            nvidia.com/gpu: "1"
            cpu: "1"
            memory: 6Gi
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
