apiVersion: apps/v1
kind: Deployment
metadata:
  name: epp-smollm2-1-7b-instruct
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: epp-smollm2-1-7b-instruct
  template:
    metadata:
      labels:
        app: epp-smollm2-1-7b-instruct
    spec:
      serviceAccountName: epp-sa
      terminationGracePeriodSeconds: 130
      containers:
      - name: epp
        image: registry.k8s.io/gateway-api-inference-extension/epp:v1.4.0
        args:
        - --pool-name
        - smollm2-1-7b-instruct
        - --pool-namespace
        - default
        - --pool-group
        - inference.networking.k8s.io
        - --grpc-port
        - "9002"
        - --grpc-health-port
        - "9003"
        - --config-file
        - /config/default-plugins.yaml
        - --zap-encoder
        - json
        - --v
        - "4"
        - --tracing=false
        - --metrics-endpoint-auth=false
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - name: grpc
          containerPort: 9002
        - name: grpc-health
          containerPort: 9003
        - name: metrics
          containerPort: 9090
        livenessProbe:
          grpc:
            port: 9003
            service: inference-extension
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          grpc:
            port: 9003
            service: inference-extension
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            memory: 2Gi
        volumeMounts:
        - name: plugins-config-volume
          mountPath: /config
      volumes:
      - name: plugins-config-volume
        configMap:
          name: epp-config
